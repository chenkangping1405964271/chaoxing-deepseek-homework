<style>
  :host { --ink:#244266; --muted:#7890a7; --line:#dce9f3; --blue:#4d8bc8; --mint:#e6f5f0; position:fixed; right:20px; bottom:20px; z-index:2147483647; color:var(--ink); font:13px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; text-align:left; color-scheme:light; }
  *,*::before,*::after { box-sizing:border-box; }
  [hidden] { display:none!important; }
  button,input,summary { font:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  button:focus-visible,summary:focus-visible { outline:3px solid #84b6d9; outline-offset:3px; }
  .box { width:min(388px,calc(100vw - 40px)); max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); display:flex; flex-direction:column; overflow:hidden; background:#fbfdff; border:1px solid #ffffff; border-radius:26px; box-shadow:0 20px 65px #274a6a30,0 3px 13px #345b7010; }

  .hero::after { content:"✦"; position:absolute; right:116px; top:55px; color:#d4af68; font-size:19px; text-shadow:105px 60px 0 #a4c3da; pointer-events:none; }

  h3 { position:relative; z-index:2; width:max-content; max-width:59%; margin:16px 0 3px; font-size:27px; font-weight:800; line-height:1.24; letter-spacing:.02em; color:#26496f; }

  .collapse { position:absolute; z-index:4; right:13px; top:13px; width:29px; height:27px; padding:0; border:1px solid #ffffffd9; border-radius:9px; background:#ffffff99; color:#6485a0; font-size:20px; line-height:1; }
  .collapse:hover { background:#fff; }
  .mascot-slot { position:absolute; z-index:1; right:4px; bottom:0; width:172px; height:153px; pointer-events:none; }
  .mascot-slot::before { content:""; position:absolute; bottom:10px; left:30px; width:119px; height:24px; border-radius:50%; background:#a8c8df38; filter:blur(7px); }
  .hero-art { position:relative; display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 5px 5px #47678d16); }
  .fallback { display:grid; place-items:center; width:100%; height:100%; font-size:67px; }
  .body { min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:13px 14px 7px; scrollbar-width:thin; scrollbar-color:#ccdde9 transparent; }
  .pose-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-bottom:12px; }
  .pose { position:relative; min-width:0; padding:3px 2px 5px; border:1px solid transparent; border-radius:13px; background:#f0f6fb; color:#7891a8; transition:background .16s,border-color .16s,transform .16s; }
  .pose:hover:not(:disabled) { transform:translateY(-2px); background:#e8f2fa; }

  .summary-right { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:10px; }
  .chevron { width:7px; height:7px; margin-right:3px; border-right:1px solid #89a4ba; border-bottom:1px solid #89a4ba; transform:rotate(45deg); transition:transform .15s; }
  details[open] .chevron { transform:rotate(225deg); }
  .connection-body { padding:1px 12px 12px; }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 10px; font-size:12px; font-weight:700; }

  label { display:block; color:#5c7892; font-size:11px; font-weight:600; }
  label+label { margin-top:9px; }
  input[type=password],input[type=text],input[type=number] { display:block; width:100%; min-width:0; height:35px; margin-top:5px; padding:7px 10px; border:1px solid #dde8f0; border-radius:10px; background:#f8fbfd; color:#355670; font-size:12px; font-weight:400; outline:none; transition:border-color .15s,box-shadow .15s; }
  input::placeholder { color:#a1b1bf; }
  input:focus-visible { border-color:#8fbadd; box-shadow:0 0 0 3px #c8e1f45c; }

  .tool:hover:not(:disabled) { background:#eaf4fb; border-color:#bfd8e9; }
  .switches { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .switches label { display:flex; align-items:center; gap:7px; margin:0; padding:8px; border:1px solid #edf2f6; border-radius:10px; background:#f7fafc; font-size:11px; }
  input[type=checkbox] { flex:none; width:15px; height:15px; margin:0; accent-color:#6298c5; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row label { flex:1; min-width:0; margin:0; }
  .log-section { margin:0 0 5px; border-top:1px dashed #e0eaf1; }
  .log-section summary { padding:7px 2px; color:#8aa0b4; font-size:10px; }
  .log { max-height:80px; overflow:auto; padding:0 3px 8px; color:#7891a6; font-size:10px; overflow-wrap:anywhere; }
  .log>div { padding:3px 0; }
  .commandbar { flex-shrink:0; padding:10px 14px 11px; border-top:1px solid #e4edf4; background:#fff; }
  .status { display:flex; align-items:center; gap:9px; min-height:39px; margin-bottom:10px; padding:7px 10px; border:1px solid #e3edf5; border-radius:12px; background:#f2f7fb; color:#5c7b95; font-size:11px; overflow-wrap:anywhere; }
  .dot { flex:none; width:7px; height:7px; border-radius:50%; background:#8db5d1; box-shadow:0 0 0 3px #dfeef8; }
  .box[data-tone=working] .dot { background:#6b9bcf; box-shadow:0 0 0 3px #dae8f7; animation:pulse 1.7s ease-in-out infinite; }
  .box[data-tone=working] .hero-art { animation:float 3s ease-in-out infinite; }
  .box[data-tone=paused] .status { border-color:#ece3d3; background:#fbf7ee; color:#9b825d; }
  .box[data-tone=paused] .dot { background:#c8aa72; box-shadow:0 0 0 3px #f3e9d5; }
  .box[data-tone=complete] .status { border-color:#d9eee4; background:#edf8f2; color:#66957f; }
  .box[data-tone=complete] .dot { background:#80b39a; box-shadow:0 0 0 3px #dceee4; }
  .actions { display:grid; grid-template-columns:1.55fr 1fr; gap:8px; }
  .primary,.secondary { min-height:42px; border-radius:12px; font-size:12px; font-weight:700; }
  .primary { display:flex; justify-content:center; align-items:center; gap:8px; padding:9px; border:1px solid #6595c4; background:#6b9bc9; color:white; box-shadow:0 4px 9px #7ea9ce2e; }
  .primary:hover:not(:disabled) { background:#578bbd; }
  .primary svg { width:19px; height:14px; fill:currentColor; }
  .secondary { border:1px solid #e0e9f1; background:#f3f7fa; color:#7390a8; }
  .secondary:hover:not(:disabled) { background:#e8f1f8; }
  .footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; color:#a1b0bd; font-size:9px; }
  .diagnostic { min-height:24px; padding:0; border:0; background:transparent; color:#8aa1b5; font-size:10px; }
  .diagnostic:hover { color:#5685aa; }
  .dock { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; width:88px; min-height:100px; padding:0 0 7px; border:1px solid #d4e6f3; border-radius:23px; background:linear-gradient(#f5fbff,#e3f0fa); color:#5c82a4; box-shadow:0 8px 25px #3e68812b; }
  .dock img { width:85px; height:82px; object-fit:contain; }
  .dock span { font-size:10px; font-weight:700; line-height:1.2; }
  @keyframes float { 50% { transform:translateY(-3px); } }
  @keyframes pulse { 50% { opacity:.45; } }
  @media(max-width:420px) { :host { right:8px; bottom:8px; } .box { width:min(388px,calc(100vw - 16px)); max-height:calc(100vh - 16px); max-height:calc(100dvh - 16px); border-radius:22px; } }
  @media(max-height:620px) { .hero { min-height:135px; padding-top:12px; padding-bottom:12px; } h3 { margin-top:12px; font-size:24px; } .hero-note { margin-top:8px; } .mascot-slot { width:147px; height:128px; } .pose img { height:36px; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
</style>
